services:
  db:
    image: postgis/postgis:16-3.4
    container_name: roadwatch_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-roadwatch}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roadwatch_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AI_SERVICE_URL: http://ai-service:8001
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: roadwatch_ai_service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "8001:8001"
    volumes:
      - ./ai-service:/app
      - ./ai-service/weights:/app/weights

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: roadwatch_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_AI_SERVICE_URL: http://localhost:8001
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
