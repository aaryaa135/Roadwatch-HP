# RoadWatch HP Alembic configuration

[alembic]
# path to migration scripts
script_location = app/migrations

# database url is overridden at runtime from settings.database_url
sqlalchemy.url = driver://user:pass@localhost/dbname

# version location
version_locations = backend/app/migrations/versions

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for local timezone
timezone = UTC

# max length of characters to apply to the
# "version code" column
version_code_length = 32

# template used to generate migration files
# The default template uses a slugified version of the message.
# Uncomment the line below to customize.
# file_template = %%(rev)s_%%(slug)s

# version code separator
version_code_separator = _

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated migration scripts.  See the documentation for further
# detail and examples.

# using a Python function
# hooks = myfunction
# myfunction = myproject.scripts:myfunction

# using a script
# hooks = myscript
# myscript = myproject/scripts/myscript.sh

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(asctime)s] %(name)s: %(message)s
datefmt = %H:%M:%S
